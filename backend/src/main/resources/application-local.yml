spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=shoe_commerce;encrypt=true;trustServerCertificate=true}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        secure: false

payment:
  vnpay:
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/return}
