<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý hóa đơn</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><aside class="sidebar"><div class="brand">QLCH<span>Giày</span></div><nav class="nav">
<a th:href="@{/dashboard}"><span>🏠 Tổng quan</span></a><a th:href="@{/sanpham}"><span>👟 Sản phẩm</span></a><a th:href="@{/kho}"><span>📦 Kho hàng</span></a><a th:href="@{/khachhang}"><span>👥 Khách hàng</span></a><a th:href="@{/hoadon}"><span>🧾 Hóa đơn</span></a><a th:href="@{/nhacungcap}"><span>🚚 Nhà cung cấp</span></a><a th:href="@{/baocao}"><span>📊 Báo cáo</span></a><a th:href="@{/chatbot}"><span>🤖 Chatbot</span></a><a th:href="@{/logout}"><span>↪ Đăng xuất</span></a></nav></aside><main class="main"><div class="top"><h1>Quản lý hóa đơn</h1><div class="user">Cửa hàng Sneaker</div></div><section class="card"><div class="toolbar"><input class="search" placeholder="Tìm hóa đơn..."><button class="btn">+ Tạo hóa đơn</button></div><table><thead><tr><th>Mã hóa đơn</th><th>Đơn hàng</th><th>Nhân viên</th><th>Ngày lập</th><th>Tổng tiền</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="x:${items}"><td th:text="${'#HD-'+x.id}"></td><td th:text="${x.maDonHang != null ? x.maDonHang.id : '-'}"></td><td th:text="${x.maNhanVien != null ? x.maNhanVien.tenNhanVien : '-'}"></td><td th:text="${x.ngayLap}"></td><td class="money" th:text="${#numbers.formatDecimal(x.tongTien,0,'COMMA',0,'POINT')}+' đ'"></td><td><span class="badge" th:text="${x.trangThai}"></span></td></tr></tbody></table></section></main></body></html>
