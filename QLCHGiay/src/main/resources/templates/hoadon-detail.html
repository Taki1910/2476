<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Chi tiết hóa đơn</title><style>body{background:#0d0c0b;color:#eee;font:16px Arial}.box{max-width:650px;margin:50px auto;padding:30px;background:#171513;border-radius:16px}h1{color:#ff6a1a}.row{padding:14px 0;border-bottom:1px solid #302c29}.row b{display:inline-block;width:170px;color:#aaa}.btn{display:inline-block;margin-top:24px;padding:12px 18px;border-radius:8px;background:#ff6422;color:#fff;text-decoration:none}@media print{body{background:#fff;color:#000}.box{margin:0;box-shadow:none}.btn{display:none}}</style></head><body th:attr="onload=${printMode == true ? 'window.print()' : null}"><main class="box"><h1>HÓA ĐƠN BÁN HÀNG</h1><div class="row"><b>Mã hóa đơn</b><span th:text="${'#HD-' + item.id}"></span></div><div class="row"><b>Đơn hàng</b><span th:text="${item.maDonHang != null ? '#DH-' + item.maDonHang.id : '-'}"></span></div><div class="row"><b>Nhân viên</b><span th:text="${item.maNhanVien != null ? item.maNhanVien.tenNhanVien : '-'}"></span></div><div class="row"><b>Ngày lập</b><span th:text="${#temporals.format(item.ngayLap,'dd/MM/yyyy')}"></span></div><div class="row"><b>Tổng tiền</b><strong th:text="${#numbers.formatDecimal(item.tongTien,0,'COMMA',0,'POINT') + ' đ'}"></strong></div><div class="row"><b>Trạng thái</b><span th:text="${item.trangThai}"></span></div><a class="btn" th:href="@{/hoadon/sua/{id}(id=${item.id})}">Chỉnh sửa</a> <a class="btn" href="javascript:window.print()">In hóa đơn</a> <a class="btn" th:href="@{/hoadon}">Quay lại</a></main></body></html>
