<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Chi tiết hóa đơn</title>
    <script th:src="@{/js/theme.js}" src="/js/theme.js"></script>
    <script th:src="@{/js/app-i18n.js}" src="/js/app-i18n.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0d0c0b; color: #eee; font: 15px Arial; }
        .invoice {
            max-width: 820px;
            margin: 38px auto;
            padding: 35px;
            background: #fff;
            color: #25211f;
            border-radius: 18px;
        }
        .head {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding-bottom: 24px;
            border-bottom: 2px solid #f06425;
        }
        .brand h1 { margin: 0; color: #f06425; font-size: 26px; }
        .brand p, .meta p { margin: 7px 0; color: #777; }
        .meta { text-align: right; }
        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin: 25px 0;
        }
        .box { padding: 17px; background: #f8f6f4; border-radius: 11px; }
        .box small { display: block; color: #888; margin-bottom: 7px; }
        .box strong { font-size: 16px; }
        .items { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .items th, .items td {
            padding: 13px 10px;
            border-bottom: 1px solid #e8e3df;
            text-align: left;
        }
        .items th { color: #777; font-size: 12px; text-transform: uppercase; }
        .items td:nth-child(n+2), .items th:nth-child(n+2) { text-align: right; }
        .total {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 25px;
            margin-top: 20px;
        }
        .total strong { font-size: 25px; color: #f06425; }
        .status {
            display: inline-block;
            margin-top: 8px;
            padding: 7px 11px;
            border-radius: 20px;
            background: #fff0e9;
            color: #d84c0c;
            font-weight: bold;
        }
        .actions {
            max-width: 820px;
            margin: 0 auto 35px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .actions form { margin: 0; }
        .btn {
            padding: 11px 16px;
            border: 0;
            border-radius: 9px;
            background: #332e2a;
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            font: inherit;
        }
        .btn.primary { background: #f06425; }
        @media (max-width: 650px) {
            .invoice { margin: 0; border-radius: 0; padding: 22px; }
            .head, .info { display: block; }
            .meta { text-align: left; margin-top: 18px; }
            .info .box { margin-bottom: 10px; }
            .items th:nth-child(3), .items td:nth-child(3) { display: none; }
            .actions { padding: 0 12px; }
        }
        @media print {
            body { background: #fff; }
            .invoice { margin: 0 auto; padding: 15px; }
            .actions { display: none; }
        }
    </style>
</head>
<body th:attr="onload=${printMode == true ? 'window.print()' : null}">
<main class="invoice">
    <header class="head">
        <div class="brand">
            <h1>SNEAKER STORE</h1>
            <p>HÓA ĐƠN BÁN HÀNG</p>
        </div>
        <div class="meta">
            <strong th:text="${'#HD-' + item.id}">#HD</strong>
            <p th:text="${#temporals.format(item.ngayLap,'dd/MM/yyyy')}"></p>
            <span class="status" th:text="${item.trangThai}"></span>
        </div>
    </header>

    <section class="info">
        <div class="box">
            <small>KHÁCH HÀNG</small>
            <strong th:text="${item.maDonHang != null && item.maDonHang.maKH != null ? item.maDonHang.maKH.tenKH : 'Khách lẻ'}"></strong>
            <p th:if="${item.maDonHang != null && item.maDonHang.maKH != null}"
               th:text="${item.maDonHang.maKH.soDienThoai ?: 'Không có số điện thoại'}"></p>
        </div>
        <div class="box">
            <small>NHÂN VIÊN PHỤ TRÁCH</small>
            <strong th:text="${item.maNhanVien != null ? item.maNhanVien.tenNhanVien : 'Chưa phân công'}"></strong>
            <p th:text="${item.maDonHang != null ? '#DH-' + item.maDonHang.id : '-'}"></p>
        </div>
    </section>

    <table class="items">
        <thead>
        <tr>
            <th>Sản phẩm</th>
            <th>Đơn giá</th>
            <th>Số lượng</th>
            <th>Thành tiền</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d:${details}">
            <td>
                <strong th:text="${d.maChiTietSP != null && d.maChiTietSP.maSP != null ? d.maChiTietSP.maSP.tenSP : 'Sản phẩm'}"></strong>
            </td>
            <td th:text="${#numbers.formatDecimal(d.donGia,0,'COMMA',0,'POINT') + ' đ'}"></td>
            <td th:text="${d.soLuong}"></td>
            <td th:text="${#numbers.formatDecimal(d.donGia * d.soLuong,0,'COMMA',0,'POINT') + ' đ'}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(details)}">
            <td colspan="4">Hóa đơn chưa có sản phẩm.</td>
        </tr>
        </tbody>
    </table>
    <div class="total">
        <span>Tổng thanh toán</span>
        <strong th:text="${#numbers.formatDecimal(item.tongTien,0,'COMMA',0,'POINT') + ' đ'}"></strong>
    </div>
</main>

<nav class="actions">
    <a class="btn" th:href="@{/hoadon}">Quay lại</a>
    <form method="post" th:action="@{/hoadon/in/{id}(id=${item.id})}">
        <button class="btn" type="submit">In hóa đơn</button>
    </form>
    <a class="btn primary" th:href="@{/hoadon/sua/{id}(id=${item.id})}">Chỉnh sửa</a>
</nav>
</body>
</html>
