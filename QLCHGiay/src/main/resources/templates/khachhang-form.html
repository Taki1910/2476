<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title th:text="${pageTitle}">Khách hàng</title>
    <script th:src="@{/js/theme.js}" src="/js/theme.js"></script>
    <script th:src="@{/js/app-i18n.js}" src="/js/app-i18n.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0d0c0b; color: #eee; font-family: Arial; }
        .box {
            max-width: 720px;
            margin: 45px auto;
            padding: 28px;
            background: #171513;
            border: 1px solid #302c29;
            border-radius: 16px;
        }
        h1 { color: #ff6a1a; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .full { grid-column: 1/-1; }
        label { display: block; margin-bottom: 7px; color: #aaa; }
        input, select {
            width: 100%;
            padding: 12px;
            background: #211e1b;
            color: #fff;
            border: 1px solid #3a3531;
            border-radius: 8px;
        }
        input.invalid, select.invalid {
            border-color: #ff5d62;
            box-shadow: 0 0 0 3px rgba(255, 93, 98, .14);
        }
        .hint { display: block; color: #8f8984; font-size: 12px; margin-top: 6px; }
        .field-error { display: block; margin-top: 6px; color: #ff8a8e; font-size: 12px; }
        .field-invalid label { color: #ff8a8e; }
        .form-error {
            margin: 0 0 20px;
            padding: 12px 14px;
            border: 1px solid rgba(255, 93, 98, .4);
            border-radius: 8px;
            background: rgba(255, 93, 98, .1);
            color: #ffb0b3;
        }
        .form-error strong { display: block; }
        .form-error ul { margin: 8px 0 0; padding-left: 20px; }
        .form-error li + li { margin-top: 4px; }
        .actions { display: flex; gap: 12px; margin-top: 24px; }
        .btn {
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            text-decoration: none;
            color: #fff;
            background: #39332e;
        }
        .primary { background: #ff6422; }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .full { grid-column: auto; }
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/theme.css}" href="/css/theme.css">
</head>
<body>
<main class="box">
    <h1 th:text="${pageTitle}">Khách hàng</h1>
    <form method="post" th:object="${item}"
          th:action="${item.id == null} ? @{/khachhang/them} : @{/khachhang/sua/{id}(id=${item.id})}">
        <section class="form-error" role="alert" aria-live="assertive"
                 th:if="${#fields.hasAnyErrors()}">
            <strong>Không thể lưu khách hàng. Vui lòng sửa các trường sau:</strong>
            <ul>
                <li th:each="error : ${#fields.allErrors()}" th:text="${error}">
                    Thông tin chưa hợp lệ.
                </li>
            </ul>
        </section>
        <div class="grid">
            <div class="full field-group"
                 th:classappend="${#fields.hasErrors('tenKH')} ? 'field-invalid' : ''">
                <label for="tenKH">Họ tên *</label>
                <input id="tenKH" th:field="*{tenKH}" th:errorclass="invalid"
                       required minlength="2" maxlength="100" autocomplete="name"
                       aria-describedby="tenKH-error"
                       th:aria-invalid="${#fields.hasErrors('tenKH')}">
                <small id="tenKH-error" class="field-error" th:errors="*{tenKH}"></small>
            </div>
            <div class="field-group">
                <label for="gioiTinh">Giới tính</label>
                <select id="gioiTinh" th:field="*{gioiTinh}">
                    <option value="true">Nam</option>
                    <option value="false">Nữ</option>
                </select>
            </div>
            <div class="field-group"
                 th:classappend="${#fields.hasErrors('ngaySinh')} ? 'field-invalid' : ''">
                <label for="ngaySinh">Ngày sinh</label>
                <input id="ngaySinh" type="date" th:field="*{ngaySinh}" th:errorclass="invalid"
                       min="1900-01-01"
                       th:max="${T(java.time.LocalDate).now()}"
                       aria-describedby="ngaySinh-error"
                       th:aria-invalid="${#fields.hasErrors('ngaySinh')}">
                <small id="ngaySinh-error" class="field-error" th:errors="*{ngaySinh}"></small>
            </div>
            <div class="field-group"
                 th:classappend="${#fields.hasErrors('soDienThoai')} ? 'field-invalid' : ''">
                <label for="soDienThoai">Số điện thoại</label>
                <input id="soDienThoai" type="tel" th:field="*{soDienThoai}" th:errorclass="invalid"
                       maxlength="10" inputmode="numeric" autocomplete="tel"
                       pattern="(03|05|07|08|09)[0-9]{8}"
                       title="Số điện thoại không đúng định dạng số di động Việt Nam."
                       placeholder="09xxxxxxxx"
                       aria-describedby="soDienThoai-hint soDienThoai-error"
                       th:aria-invalid="${#fields.hasErrors('soDienThoai')}">
                <small id="soDienThoai-hint" class="hint">10 chữ số, đầu số Việt Nam: 03, 05, 07, 08 hoặc 09</small>
                <small id="soDienThoai-error" class="field-error"
                       th:errors="*{soDienThoai}"></small>
            </div>
            <div class="field-group full"
                 th:classappend="${#fields.hasErrors('diaChi')} ? 'field-invalid' : ''"
                 id="addressFields" th:attr="data-existing-address=*{diaChi}">
                <label for="province">Tỉnh / Thành phố</label>
                <select id="province" aria-describedby="diaChi-hint diaChi-error">
                    <option value="">Chọn tỉnh hoặc thành phố</option>
                </select>
                <small id="diaChi-hint" class="hint">Địa chỉ được chọn bằng tối đa 2 trường và tự động lưu theo dạng Quận/Huyện, Tỉnh/Thành phố.</small>
            </div>
            <div class="field-group full"
                 th:classappend="${#fields.hasErrors('diaChi')} ? 'field-invalid' : ''">
                <label for="district">Quận / Huyện / Thị xã</label>
                <select id="district" disabled>
                    <option value="">Chọn tỉnh/thành phố trước</option>
                </select>
                <input id="diaChi" type="hidden" th:field="*{diaChi}" maxlength="200">
                <small id="diaChi-error" class="field-error" th:errors="*{diaChi}"></small>
            </div>
        </div>
        <div class="actions">
            <button class="btn primary" type="submit">Lưu</button>
            <a class="btn" th:href="@{/khachhang}">Hủy</a>
        </div>
    </form>
</main>
<script>
    const addressFields = document.getElementById('addressFields');
    const provinceSelect = document.getElementById('province');
    const districtSelect = document.getElementById('district');
    const addressInput = document.getElementById('diaChi');
    const existingParts = (addressFields.dataset.existingAddress || '')
        .split(',')
        .map(part => part.trim())
        .filter(Boolean);
    const existingProvince = existingParts.at(-1) || '';
    const existingDistrict = existingParts.length > 1 ? existingParts.at(-2) : '';
    let provinces = [];

    function fillDistricts(provinceName, selectedDistrict = '') {
        const province = provinces.find(item => item.name === provinceName);
        districtSelect.replaceChildren(new Option(
            province ? 'Chọn quận, huyện hoặc thị xã' : 'Chọn tỉnh/thành phố trước',
            ''
        ));
        (province?.districts || []).forEach(item => {
            districtSelect.add(new Option(item.name, item.name, false, item.name === selectedDistrict));
        });
        districtSelect.disabled = !province;
        districtSelect.required = Boolean(province);
    }

    fetch('https://provinces.open-api.vn/api/v1/?depth=2')
        .then(response => {
            if (!response.ok) throw new Error('Không tải được dữ liệu địa chỉ');
            return response.json();
        })
        .then(data => {
            provinces = data;
            provinces.forEach(item => {
                provinceSelect.add(new Option(item.name, item.name, false, item.name === existingProvince));
            });
            fillDistricts(provinceSelect.value, existingDistrict);
        })
        .catch(() => {
            if (existingProvince) {
                provinceSelect.add(new Option(existingProvince, existingProvince, true, true));
                provinces = [{name: existingProvince, districts: existingDistrict ? [{name: existingDistrict}] : []}];
                fillDistricts(existingProvince, existingDistrict);
            } else {
                provinceSelect.options[0].textContent = 'Không tải được danh sách địa chỉ';
            }
        });

    provinceSelect.addEventListener('change', () => fillDistricts(provinceSelect.value));
    document.querySelector('form').addEventListener('submit', () => {
        addressInput.value = provinceSelect.value
            ? [districtSelect.value, provinceSelect.value].filter(Boolean).join(', ')
            : '';
    });
</script>
</body>
</html>
