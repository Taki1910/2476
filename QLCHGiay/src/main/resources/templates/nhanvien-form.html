<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle + ' - KICKS ZONE'}">Nhân viên</title>
    <script th:src="@{/js/theme.js}" src="/js/theme.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0d0c0b;color:#f5f5f5;font:15px Arial,Helvetica,sans-serif}.page{max-width:820px;margin:0 auto;padding:38px 18px}.back{display:inline-flex;align-items:center;gap:8px;color:#aaa5a1;text-decoration:none}.box{margin-top:20px;padding:28px;background:#171513;border:1px solid #302c29;border-radius:16px}.header{margin-bottom:24px}.header h1{margin:0 0 7px;color:#ff7626}.header p{margin:0;color:#918c87}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}.field label{display:block;margin-bottom:7px;color:#c9c2bc;font-weight:700}.field input,.field select{width:100%;min-height:46px;padding:11px 12px;border:1px solid #3a3531;border-radius:8px;outline:0;background:#211e1b;color:#fff}.field input:focus,.field select:focus{border-color:#ff7626;box-shadow:0 0 0 3px rgba(255,118,38,.14)}.hint{display:block;margin-top:6px;color:#8f8984;font-size:12px}.alert{margin-bottom:20px;padding:12px 14px;border:1px solid rgba(255,93,98,.4);border-radius:8px;background:rgba(255,93,98,.1);color:#ffb0b3}.check{min-height:46px;display:flex;align-items:center;gap:10px;padding:0 12px;border:1px solid #3a3531;border-radius:8px;background:#211e1b}.check input{width:18px;height:18px;accent-color:#ff6422}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:26px}.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;border:0;border-radius:9px;text-decoration:none;color:#fff;background:#39332e;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#ff5722,#ff9800)}@media(max-width:640px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.box{padding:22px 16px}.actions{flex-direction:column-reverse}.btn{width:100%}}
    </style>
    <link rel="stylesheet" th:href="@{/css/theme.css}" href="/css/theme.css">
</head>
<body><main class="page">
    <a class="back" th:href="@{/nhanvien}"><i class="fa-solid fa-arrow-left"></i> Quay lại danh sách</a>
    <section class="box">
        <header class="header"><h1 th:text="${pageTitle}">Nhân viên</h1><p th:text="${item.id == null ? 'Tạo hồ sơ và tài khoản đăng nhập cho nhân viên mới.' : 'Cập nhật hồ sơ và trạng thái làm việc.'}">Thông tin nhân viên</p></header>
        <div th:if="${error}" class="alert" role="alert" th:text="${error}">Thông tin chưa hợp lệ.</div>
        <form method="post" th:object="${item}" th:action="${item.id == null} ? @{/nhanvien/them} : @{/nhanvien/sua/{id}(id=${item.id})}">
            <div class="grid">
                <div class="field full"><label for="tenNhanVien">Họ tên *</label><input id="tenNhanVien" th:field="*{tenNhanVien}" required minlength="2" maxlength="100" autocomplete="name"></div>
                <div class="field"><label for="gioiTinh">Giới tính</label><select id="gioiTinh" th:field="*{gioiTinh}"><option value="true">Nam</option><option value="false">Nữ</option></select></div>
                <div class="field"><label for="ngaySinh">Ngày sinh *</label><input id="ngaySinh" type="date" th:field="*{ngaySinh}" min="1900-01-01" th:max="${T(java.time.LocalDate).now().minusYears(18)}" required title="Nhân viên phải đủ 18 tuổi trở lên."><small class="hint">Nhân viên phải đủ 18 tuổi trở lên.</small></div>
                <div class="field"><label for="soDienThoai">Số điện thoại</label><input id="soDienThoai" type="tel" th:field="*{soDienThoai}" pattern="0[0-9]{9}" maxlength="10" inputmode="numeric" autocomplete="tel"><small class="hint">Đúng 10 chữ số, bắt đầu bằng 0.</small></div>
                <div class="field"><label for="queQuan">Quê quán</label><input id="queQuan" th:field="*{queQuan}" maxlength="100" autocomplete="address-level1"></div>

                <th:block th:if="${item.id == null}">
                    <div class="field full"><label for="tenDangNhap">Tên đăng nhập *</label><input id="tenDangNhap" name="tenDangNhap" th:value="${tenDangNhap}" required minlength="4" maxlength="50" pattern="[A-Za-z0-9._-]+" autocomplete="username"><small class="hint">Dùng chữ, số, dấu chấm, gạch ngang hoặc gạch dưới.</small></div>
                    <div class="field"><label for="matKhau">Mật khẩu *</label><input id="matKhau" name="matKhau" type="password" minlength="8" maxlength="72" required autocomplete="new-password"></div>
                    <div class="field"><label for="xacNhanMatKhau">Nhập lại mật khẩu *</label><input id="xacNhanMatKhau" name="xacNhanMatKhau" type="password" minlength="8" maxlength="72" required autocomplete="new-password"></div>
                </th:block>
                <th:block th:unless="${item.id == null}">
                    <div class="field"><label>Tài khoản đăng nhập</label><input th:value="${account != null ? '@' + account.tenDangNhap : 'Chưa có tài khoản'}" disabled></div>
                    <div class="field"><label for="active">Trạng thái</label><label class="check"><input id="active" name="active" type="checkbox" value="true" th:checked="${item.trangThai == null || !#strings.containsIgnoreCase(item.trangThai,'ngừng')}"><span>Đang làm việc</span></label></div>
                </th:block>
            </div>
            <div class="actions"><a class="btn" th:href="@{/nhanvien}">Hủy</a><button class="btn primary" type="submit"><i class="fa-solid fa-floppy-disk"></i> Lưu nhân viên</button></div>
        </form>
    </section>
</main></body>
</html>
