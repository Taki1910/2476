<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý sản phẩm</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><aside class="sidebar"><div class="brand">QLCH<span>Giày</span></div><nav class="nav">
<a th:href="@{/dashboard}"><span>🏠 Tổng quan</span></a><a th:href="@{/sanpham}"><span>👟 Sản phẩm</span></a><a th:href="@{/kho}"><span>📦 Kho hàng</span></a><a th:href="@{/khachhang}"><span>👥 Khách hàng</span></a><a th:href="@{/hoadon}"><span>🧾 Hóa đơn</span></a><a th:href="@{/nhacungcap}"><span>🚚 Nhà cung cấp</span></a><a th:href="@{/baocao}"><span>📊 Báo cáo</span></a><a th:href="@{/chatbot}"><span>🤖 Chatbot</span></a><a th:href="@{/logout}"><span>↪ Đăng xuất</span></a></nav></aside><main class="main"><div class="top"><h1>Quản lý sản phẩm</h1><div class="user">Cửa hàng Sneaker</div></div><section class="card"><div class="toolbar"><input class="search" placeholder="Tìm kiếm sản phẩm..."><button class="btn">+ Thêm sản phẩm</button></div><table><thead><tr><th>Mã</th><th>Tên sản phẩm</th><th>Loại</th><th>Màu</th><th>Size</th><th>Giá</th><th>Tồn kho</th></tr></thead><tbody><tr th:each="x:${items}"><td th:text="${x.id}"></td><td th:text="${x.tenSP}"></td><td th:text="${x.maLoai != null ? x.maLoai.tenLoai : '-'}"></td><td th:text="${x.maMau != null ? x.maMau.tenMau : '-'}"></td><td th:text="${x.maSize != null ? x.maSize.tenSize : '-'}"></td><td class="money" th:text="${#numbers.formatDecimal(x.gia,0,'COMMA',0,'POINT')}+' đ'"></td><td><span class="badge" th:text="${x.tonKho}"></span></td></tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="7" class="empty">Chưa có dữ liệu sản phẩm</td></tr></tbody></table></section></main></body></html>
