<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <script th:src="@{/js/theme.js}" src="/js/theme.js"></script>
    <script th:src="@{/js/app-i18n.js}" src="/js/app-i18n.js"></script>
    <title>Chi tiết sản phẩm - KICKS ZONE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0d0c0b;color:#f5f5f5;font-family:Arial,sans-serif}.page{max-width:820px;margin:0 auto;padding:42px 20px}.back{color:#aaa5a1;text-decoration:none}.card{margin-top:22px;padding:28px;background:#151311;border:1px solid #2b2825;border-radius:16px}.title{display:flex;justify-content:space-between;gap:16px;align-items:start;padding-bottom:22px;border-bottom:1px solid #2b2825}.title h1{margin:0 0 8px;font-size:24px}.code{color:#ff7626;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:12px}.item{padding:17px 8px;border-bottom:1px solid #27231f}.item span{display:block;color:#88827d;font-size:12px;margin-bottom:7px}.item strong{font-size:15px}.money{color:#ffad67}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.btn{height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 17px;border-radius:9px;text-decoration:none;font-weight:700}.secondary{background:#27231f;color:#d0cbc7}.primary{background:linear-gradient(135deg,#ff5722,#ff9800);color:#fff}@media(max-width:600px){.grid{grid-template-columns:1fr}.page{padding:20px 14px}.title{flex-direction:column}}
    </style>
    <link rel="stylesheet" th:href="@{/css/theme.css}" href="/css/theme.css">
</head>
<body><main class="page"><a class="back" th:href="@{/sanpham}"><i class="fa-solid fa-arrow-left"></i> Quay lại danh sách</a><section class="card">
    <div class="title"><div><h1 th:text="${sanPham.tenSP}">Tên sản phẩm</h1><span class="code" th:text="'SP' + ${sanPham.id}">SP1</span></div><i class="fa-solid fa-shoe-prints" style="font-size:38px;color:#ff6a1a"></i></div>
    <div class="grid">
        <div class="item"><span>Loại</span><strong th:text="${sanPham.maLoai != null ? sanPham.maLoai.tenLoai : '-'}">-</strong></div>
        <div class="item"><span>Màu sắc</span><strong th:text="${sanPham.maMau != null ? sanPham.maMau.tenMau : '-'}">-</strong></div>
        <div class="item"><span>Chất liệu</span><strong th:text="${sanPham.maChatLieu != null ? sanPham.maChatLieu.tenChatLieu : '-'}">-</strong></div>
        <div class="item"><span>Size</span><strong th:text="${sanPham.maSize != null ? sanPham.maSize.tenSize : '-'}">-</strong></div>
        <div class="item"><span>Giá bán</span><strong class="money" th:text="${sanPham.gia != null ? #numbers.formatDecimal(sanPham.gia,0,'COMMA',0,'POINT') + ' đ' : '0 đ'}">0 đ</strong></div>
        <div class="item"><span>Số lượng tồn</span><strong th:text="${sanPham.tonKho != null ? sanPham.tonKho : 0}">0</strong></div>
    </div>
    <div class="actions"><a class="btn secondary" th:href="@{/sanpham}">Danh sách</a><a class="btn primary" th:href="@{/sanpham/sua/{id}(id=${sanPham.id})}"><i class="fa-solid fa-pen"></i> Cập nhật</a></div>
</section></main></body>
</html>
